# 🔒 SECURITY 7.4.5 — Dependabot opens a pull request when a package needs updating (OWASP A06)
version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
